<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>财报问答助手</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#f5f6f8; --card:#fff; --accent:#2b5cff; --muted:#8a8f99; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Microsoft YaHei",system-ui,sans-serif; background:var(--bg); height:100vh; display:flex; flex-direction:column; }
  header { background:var(--card); border-bottom:1px solid #e5e7eb; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:16px; }
  header button { border:1px solid #d0d3d9; background:#fff; border-radius:6px; padding:6px 14px; cursor:pointer; }
  #chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:80%; padding:10px 14px; border-radius:10px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .user { align-self:flex-end; background:var(--accent); color:#fff; }
  .bot { align-self:flex-start; background:var(--card); border:1px solid #e5e7eb; }
  .bot.insufficient { border-color:#f0b26b; background:#fff8ee; }
  .sources { margin-top:8px; padding-top:8px; border-top:1px dashed #e0e0e0; font-size:12px; color:var(--muted); }
  #bar { display:flex; gap:10px; padding:12px 20px; background:var(--card); border-top:1px solid #e5e7eb; }
  #input { flex:1; resize:none; height:52px; border:1px solid #d0d3d9; border-radius:8px; padding:10px; font-size:14px; }
  #send { width:80px; border:0; background:var(--accent); color:#fff; border-radius:8px; cursor:pointer; }
  #send:disabled { opacity:.5; }
</style>
</head>
<body>
<header>
  <h1>财报问答助手</h1>
  <button onclick="newSession()">新对话</button>
</header>
<div id="chat"></div>
<div id="bar">
  <textarea id="input" placeholder="请输入财报相关问题，如：中芯国际 2024 年报的营业收入"></textarea>
  <button id="send" onclick="send()">发送</button>
</div>
<script>
let sessionId = null;
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

function addMsg(cls, text, sources, insufficient) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls + (insufficient ? ' insufficient' : '');
  div.textContent = text;
  if (sources && sources.length) {
    const s = document.createElement('div');
    s.className = 'sources';
    s.textContent = '来源：' + sources.map(x => `${x.report_name} P${x.page}`).join('；');
    div.appendChild(s);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function newSession() {
  const r = await fetch('/api/session/new', {method:'POST'});
  const d = await r.json();
  sessionId = d.session_id;
  chat.innerHTML = '';
  addMsg('bot', '新对话已创建。请提问财报相关问题～');
}

async function send() {
  const msg = input.value.trim();
  if (!msg || !sessionId) return;
  addMsg('user', msg);
  input.value = '';
  sendBtn.disabled = true;
  try {
    const r = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({session_id: sessionId, message: msg})
    });
    if (r.status === 404) { addMsg('bot', '会话已过期，正在新建会话，请重发问题。'); await newSession(); return; }
    const d = await r.json();
    addMsg('bot', d.reply, d.sources, d.insufficient);
  } catch (e) {
    addMsg('bot', '请求失败：' + e.message);
  } finally {
    sendBtn.disabled = false;
  }
}

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

window.addEventListener('unload', () => {
  if (sessionId) navigator.sendBeacon('/api/session/close',
    new Blob([JSON.stringify({session_id: sessionId})], {type:'application/json'}));
});

newSession();
</script>
</body>
</html>
